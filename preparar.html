<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Preparar pedidos · Ainhoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#FAF8F4; --tarjeta:#FFFFFF; --tinta:#2B2724; --tenue:#8A8178;
  --linea:#E4DED4; --borde:#D9D2C7;
  --ok:#4A7C59; --ok-bg:#EFF5F0; --mal:#A64B42; --mal-bg:#FBF0EE;
  --al:#9A6B2F; --al-bg:#FBF4E9; --inf:#4A6B7C; --inf-bg:#EEF3F6;
  --acento:#6B5E4E;
  --display:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 64px}

.topbar{position:sticky;top:0;z-index:20;background:var(--tinta);color:#F6F3ED;
  padding:11px 16px;display:flex;align-items:center;justify-content:space-between}
.topbar .marca{font-family:var(--display);font-size:19px;letter-spacing:.14em}
.topbar .quien{font-size:11.5px;opacity:.72}
.salir{background:transparent;border:1px solid rgba(255,255,255,.3);color:#F6F3ED;
  border-radius:999px;padding:5px 13px;font-size:12px;font-family:inherit;cursor:pointer}

.pagehead{padding:18px 0 10px}
.pagehead h2{margin:0;font-size:19px;font-weight:600}
.pagehead p{margin:3px 0 0;color:var(--tenue);font-size:12.5px}

.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:13px;
  padding:14px;margin-bottom:11px}
.card.pri{border-color:var(--al);border-width:1.5px}
.card.hecho{opacity:.55}
.card.prob{border-color:var(--mal);border-width:1.5px}

.nom{font-weight:650;font-size:15.5px;word-break:break-word}
.mini{color:var(--tenue);font-size:12px}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 0}
.chip{font-size:11px;padding:2.5px 9px;border-radius:999px;border:1px solid}
.c-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.c-mal{background:var(--mal-bg);border-color:var(--mal);color:var(--mal)}
.c-al{background:var(--al-bg);border-color:var(--al);color:var(--al)}
.c-inf{background:var(--inf-bg);border-color:var(--inf);color:var(--inf)}
.c-gr{background:#F2EFE9;border-color:var(--borde);color:var(--tenue)}

.prendas{margin:11px 0 0;border-top:1px solid var(--linea)}
.pr{display:flex;gap:10px;align-items:flex-start;padding:9px 0;
  border-bottom:1px solid var(--linea);cursor:pointer}
.pr:last-child{border-bottom:0}
.tick{flex:0 0 22px;width:22px;height:22px;border:1.5px solid var(--borde);
  border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:transparent;margin-top:1px;background:#fff}
.pr.listo .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.pr.listo .txt{text-decoration:line-through;color:var(--tenue)}
.cod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  font-weight:600;letter-spacing:.02em}
.txt{flex:1;min-width:0;font-size:13px}

.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.btn{flex:1;min-width:92px;border:1px solid var(--borde);background:#fff;
  color:var(--tinta);border-radius:9px;padding:9px 11px;font-size:12.5px;
  font-weight:550;font-family:inherit;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.mal{background:#fff;border-color:var(--mal);color:var(--mal)}
.btn.big{width:100%;padding:13px;font-size:14.5px;background:var(--acento);
  border-color:var(--acento);color:#fff}
.btn[disabled]{opacity:.5}

.filtros{display:flex;gap:7px;overflow-x:auto;padding:3px 0 12px;
  -webkit-overflow-scrolling:touch}
.filtros button{white-space:nowrap;border:1px solid var(--borde);background:#fff;
  color:var(--tenue);border-radius:999px;padding:7px 14px;font-size:12.5px;
  font-family:inherit;cursor:pointer}
.filtros button[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);
  color:#F6F3ED;font-weight:600}

.f{margin-bottom:11px}
.f label{display:block;font-size:11.5px;color:var(--tenue);margin-bottom:5px}
.f input,.f textarea{width:100%;border:1px solid var(--borde);border-radius:9px;
  padding:10px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--tinta)}
.f textarea{min-height:58px;resize:vertical}

.entrar{max-width:340px;margin:0 auto;padding-top:15vh}
.entrar .logo{text-align:center;font-family:var(--display);font-size:27px;
  letter-spacing:.17em;margin-bottom:5px}
.entrar .sub{text-align:center;color:var(--tenue);font-size:12.5px;margin-bottom:24px}

.vacio{text-align:center;color:var(--tenue);padding:34px 14px;font-size:13.5px}
.cargando{text-align:center;color:var(--tenue);padding:26px;font-size:13px}
.aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;
  background:var(--tinta);color:#F6F3ED;padding:11px 17px;border-radius:11px;
  font-size:13px;max-width:92vw;box-shadow:0 7px 22px rgba(0,0,0,.2)}
.aviso.mal{background:var(--mal)}
details{margin-top:10px}
summary{font-size:12.5px;color:var(--tenue);cursor:pointer;padding:5px 0}
</style>
</head>
<body>
<div class="topbar" id="topbar" style="display:none">
  <div><div class="marca">AINHOA</div>
    <div class="quien">Preparar pedidos</div></div>
  <button class="salir" onclick="salir()">Salir</button>
</div>
<div class="wrap"><div id="app"><div class="cargando">Cargando…</div></div></div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZbEeODB-LF71H32WLSJafEKpl4sQNzMEiNQ2nvxK6LjNc1pmX0NMEbKSi5s7EXk9d/exec';

let sesion = '';
let PEDIDOS = [];
let FECHAS = [];
let FECHA = '';
let FILTRO = 'todo';
const TILDADAS = {};          // lo que Laurita ya junto, solo en su telefono

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(action, params = {}) {
  const url = new URL(APPS_SCRIPT_URL);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k, v]) => {
    if (v !== undefined && v !== null) url.searchParams.set(k, v);
  });
  if (sesion) url.searchParams.set('token', sesion);
  url.searchParams.set('_', Date.now() + '' + Math.floor(Math.random() * 1000));

  const corte = new AbortController();
  const reloj = setTimeout(() => corte.abort(), 90000);
  try {
    const res = await fetch(url.toString(), { cache: 'no-store', signal: corte.signal });
    const texto = await res.text();
    try { return JSON.parse(texto); }
    catch (e) {
      console.error('Respuesta rara:', texto.slice(0, 300));
      return { ok: false, error: 'El servidor contestó algo raro. Avisale a Angie.' };
    }
  } catch (e) {
    return { ok: false, error: e.name === 'AbortError'
      ? 'Tardó demasiado. Probá de nuevo.'
      : 'No pude conectarme. Fijate la conexión.' };
  } finally { clearTimeout(reloj); }
}

function avisar(txt, mal) {
  const d = document.createElement('div');
  d.className = 'aviso' + (mal ? ' mal' : '');
  d.textContent = txt;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), mal ? 4600 : 2600);
}

// ---------------- entrar ----------------
function pantallaEntrar(error) {
  $('topbar').style.display = 'none';
  $('app').innerHTML = `<div class="entrar">
    <div class="logo">AINHOA</div>
    <div class="sub">Preparar pedidos</div>
    <div class="f"><label for="pass">Contraseña</label>
      <input id="pass" type="password" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')entrar()"></div>
    ${error ? `<p style="color:var(--mal);font-size:12.5px;margin:0 0 12px">${esc(error)}</p>` : ''}
    <button class="btn big" id="btnEntrar" onclick="entrar()">Entrar</button>
  </div>`;
  setTimeout(() => { const p = $('pass'); if (p) p.focus(); }, 60);
}

async function entrar() {
  const pass = ($('pass') || {}).value || '';
  if (!pass) return;
  $('btnEntrar').disabled = true;
  $('btnEntrar').textContent = 'Entrando…';
  const r = await api('tandaEntrarPreparar', { pass: pass });
  if (!r || !r.ok) return pantallaEntrar((r && r.error) || 'Contraseña incorrecta.');
  sesion = r.token || '';
  $('topbar').style.display = '';
  await recargar();
}

function salir() { sesion = ''; location.reload(); }

// ---------------- cargar ----------------
async function recargar() {
  $('app').innerHTML = '<div class="cargando">Cargando pedidos…</div>';
  const r = await api('tandaPreparar', { fecha: FECHA });
  if (!r || !r.ok) {
    if (r && r.error === 'No autorizado.') return pantallaEntrar('Se cerró la sesión. Entrá de nuevo.');
    $('app').innerHTML = `<div class="vacio">${esc((r && r.error) || 'No pude cargar.')}</div>`;
    return;
  }
  PEDIDOS = r.pedidos || [];
  FECHAS = r.fechas || FECHAS;
  pintar();
}

const FILTROS = {
  todo:    ['Todo',      () => true],
  envios:  ['Envíos',    p => (p.entrega || '').toLowerCase().startsWith('env')],
  retiros: ['Retiros',   p => (p.entrega || '').toLowerCase().startsWith('ret')],
  falta:   ['Sin hacer', p => p.estado === 'pendiente'],
  problema:['Problemas', p => p.estado === 'problema' || p.estado === 'pausa']
};

function pintar() {
  const lista = PEDIDOS.filter(FILTROS[FILTRO][1]);
  const sinHacer = PEDIDOS.filter(p => p.estado === 'pendiente').length;

  $('app').innerHTML = `
  <div class="pagehead"><h2>Pedidos para preparar</h2>
    <p>${PEDIDOS.length} clienta${PEDIDOS.length === 1 ? '' : 's'} ·
       ${sinHacer} sin hacer</p></div>

  <div class="filtros">
    <button aria-pressed="${!FECHA}" onclick="verFecha('')">Todo lo pendiente</button>
    ${FECHAS.map(f => `<button aria-pressed="${FECHA === f}"
      onclick="verFecha('${f}')">${diaCorto(f)}</button>`).join('')}
  </div>

  <div class="filtros">${Object.keys(FILTROS).map(k =>
    `<button aria-pressed="${FILTRO === k}" onclick="FILTRO='${k}';pintar()">${FILTROS[k][0]}</button>`
  ).join('')}</div>

  <button class="btn big" style="margin-bottom:14px" onclick="copiarEnvios()">
    Copiar la lista de envíos</button>

  ${lista.length ? lista.map(tarjeta).join('')
                 : '<div class="vacio">Nada con ese filtro.</div>'}`;
}

function diaCorto(f) {
  const p = String(f).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] : f;
}

function verFecha(f) { FECHA = f; recargar(); }

function tarjeta(p) {
  const debe = p.pagadas < p.prendas.length;
  const envio = (p.entrega || '').toLowerCase().startsWith('env');
  const clase = p.estado === 'preparado' || p.estado === 'entregado' ? ' hecho'
              : p.estado === 'problema' ? ' prob'
              : p.prioridad ? ' pri' : '';
  const d = p.datos || {};

  return `<div class="card${clase}">
    <div class="nom">${esc(p.cliente)}</div>
    <div class="mini">${p.prendas.length} prenda${p.prendas.length === 1 ? '' : 's'}${
      p.dia ? ' · ' + diaCorto(p.dia) : ''}</div>

    <div class="chips">
      ${p.prioridad ? '<span class="chip c-al">prioridad</span>' : ''}
      <span class="chip ${envio ? 'c-inf' : 'c-gr'}">${esc(p.entrega || 'sin elegir')}</span>
      ${debe ? `<span class="chip c-mal">falta pago de ${p.prendas.length - p.pagadas}</span>`
             : '<span class="chip c-ok">todo pago</span>'}
      ${p.estado !== 'pendiente' ? `<span class="chip ${
        p.estado === 'preparado' ? 'c-ok' : p.estado === 'problema' ? 'c-mal' : 'c-al'
      }">${esc(p.estado)}</span>` : ''}
      ${envio && !d.direccion ? '<span class="chip c-al">falta dirección</span>' : ''}
    </div>

    <div class="prendas">
      ${p.prendas.map((x, i) => {
        const id = p.clave + '|' + x.codigo + '|' + i;
        return `<div class="pr${TILDADAS[id] ? ' listo' : ''}" onclick="tildar('${esc(id)}',this)">
          <div class="tick">✓</div>
          <div class="txt"><span class="cod">${esc(x.codigo)}</span>
            ${x.talle ? ` <span class="mini">· talle ${esc(x.talle)}</span>` : ''}
            <div>${esc(x.producto)}</div>
            ${x.pagada ? '' : '<div class="mini" style="color:var(--mal)">todavía no pagó esta</div>'}
          </div></div>`;
      }).join('')}
    </div>

    ${d.direccion ? `<div class="mini" style="margin-top:9px">
      ${esc(d.direccion)}${d.zona ? ' · ' + esc(d.zona) : ''}${
        d.telefono ? ' · ' + esc(d.telefono) : ''}${
        d.franja ? '<br>' + esc(d.franja) : ''}</div>` : ''}

    <div class="row">
      <button class="btn ok" onclick="estado('${esc(p.cliente)}','preparado')">Preparado</button>
      <button class="btn mal" onclick="estado('${esc(p.cliente)}','problema')">Problema</button>
      <button class="btn" onclick="estado('${esc(p.cliente)}','pausa')">En pausa</button>
    </div>

    <details>
      <summary>Datos de entrega</summary>
      <div style="margin-top:9px">
        <div class="f"><label>Nombre y apellido</label>
          <input id="n_${esc(p.clave)}" value="${esc(d.nombre || '')}"></div>
        <div class="f"><label>Dirección</label>
          <input id="d_${esc(p.clave)}" value="${esc(d.direccion || '')}"></div>
        <div class="f"><label>Zona o localidad</label>
          <input id="z_${esc(p.clave)}" value="${esc(d.zona || '')}"></div>
        <div class="f"><label>Teléfono</label>
          <input id="t_${esc(p.clave)}" inputmode="tel" value="${esc(d.telefono || '')}"></div>
        <div class="f"><label>Horario</label>
          <input id="h_${esc(p.clave)}" value="${esc(d.franja || '')}"></div>
        <div class="f"><label>Notas para el cadete</label>
          <textarea id="o_${esc(p.clave)}">${esc(d.notas || '')}</textarea></div>
        <button class="btn" onclick="guardarDatos('${esc(p.cliente)}','${esc(p.clave)}')">
          Guardar los datos</button>
      </div>
    </details>
  </div>`;
}

function tildar(id, el) {
  TILDADAS[id] = !TILDADAS[id];
  el.classList.toggle('listo', !!TILDADAS[id]);
}

async function estado(cliente, est) {
  const r = await api('tandaPrepararEstado', { cliente: cliente, estado: est });
  if (!r || !r.ok) return avisar((r && r.error) || 'No pude guardar.', true);
  avisar(cliente + ': ' + est);
  await recargar();
}

async function guardarDatos(cliente, clave) {
  const v = p => (($(p + '_' + clave) || {}).value || '').trim();
  const r = await api('tandaPrepararDatos', {
    cliente: cliente, nombre: v('n'), direccion: v('d'), zona: v('z'),
    telefono: v('t'), franja: v('h'), notas: v('o')
  });
  if (!r || !r.ok) return avisar((r && r.error) || 'No pude guardar.', true);
  avisar('Datos guardados');
  await recargar();
}

async function copiarEnvios() {
  const r = await api('tandaEnvios', { titulo: 'ENVÍOS' });
  if (!r || !r.ok) return avisar((r && r.error) || 'No pude armarla.', true);
  if (!r.cuantos) {
    return avisar('Ninguna clienta con envío tiene la dirección cargada todavía.', true);
  }
  try {
    await navigator.clipboard.writeText(r.texto);
    avisar(r.cuantos + ' envío' + (r.cuantos === 1 ? '' : 's') + ' copiados');
  } catch (e) {
    avisar('No pude copiar sola. Fijate el permiso del navegador.', true);
  }
  if (r.faltan && r.faltan.length) {
    setTimeout(() => avisar('Sin dirección: ' + r.faltan.join(', '), true), 2800);
  }
}

pantallaEntrar();
</script>
</body>
</html>
